<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laatste private-data migratie</title>
<style>
body{margin:0;background:#f4f6f8;color:#172033;font:14px/1.45 "Segoe UI",Arial,sans-serif}main{max-width:720px;margin:40px auto;padding:0 18px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:18px;padding:22px;box-shadow:0 14px 40px #17203314}h1{margin:0 0 8px;font-size:24px}p{color:#5d6878}label{display:block;margin-top:14px;font-weight:700}input{box-sizing:border-box;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #cfd6df;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#273449;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f1f4f8;white-space:pre-wrap}.ok{background:#edf8f0;color:#23663a}.error{background:#fff0f1;color:#9b2c3b}code{font-family:Consolas,monospace;font-size:12px}</style>
</head>
<body><main><div class="card">
<h1>Laatste private-data migratie</h1>
<p>Deze tijdelijke pagina verplaatst de ASES-plannergegevens en de specifieke Traffic Collector-configuratie naar de bestaande versleutelde jaarconfiguratie. De GitHub-token wordt alleen voor deze ene publicatie gebruikt en wordt niet opgeslagen.</p>
<label>Rooster-ID / team<input id="rosterId" autocomplete="off" placeholder="Team-ID"></label>
<label>Teamwachtwoord<input id="password" type="password" autocomplete="new-password"></label>
<label>GitHub fine-grained PAT<input id="pat" type="password" autocomplete="off" placeholder="github_pat_…"></label>
<button id="publish" type="button">Versleutelen en direct naar GitHub</button>
<div id="status" class="status">Nog niet gestart.</div>
</div></main>
<script>
(() => {
  "use strict";

  const OWNER = "svanbergen99";
  const REPO = "Roosteroverzicht";
  const BRANCH = "main";
  const YEAR_FILE = "Roosterindex_2026.json";

  const ASES = Object.freeze({
    version: 1,
    title: "ASES Roosterplanner",
    subtitle: "Zet kwartieren aan en zie direct je punten.",
    days: ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag"],
    points: {
      Maandag: [2,2,2,2,2,2,2,2,2,2,...Array(26).fill(1),5,5,7,7,...Array(11).fill(0),4],
      Dinsdag: [...Array(36).fill(1),5,5,7,7,...Array(11).fill(0),4],
      Woensdag: [...Array(28).fill(1),...Array(8).fill(4),5,5,7,7,...Array(11).fill(0),4],
      Donderdag: [...Array(36).fill(1),5,5,7,7,...Array(11).fill(0),4],
      Vrijdag: [...Array(26).fill(1),2,2,...Array(8).fill(3),5,5,7,7,...Array(11).fill(0),4],
      Zaterdag: [0,0,0,0,1,1,1,1,3,3,3,3,1,1,1,1,1,1,1,1,...Array(15).fill(2),...Array(17).fill(0)]
    },
    scale: {16:109,17:116,18:122,19:129,20:136,21:143,22:150,23:156,24:163,25:170,26:177,27:184,28:190,29:197,30:204,31:211,32:218,33:224,34:231,35:238,36:245,37:252,38:258,39:265,40:272},
    defaults: { contractHours: 28, targetPoints: 190, workdayHours: 8, breakHours: 0.5 }
  });

  const COLLECTOR = Object.freeze({
    kibanaOrigin: "https://achmea-production-1-a3srealtime-eu-west-1-prod.kb.eu-west-1.aws.found.io",
    dashboardUrl: "https://achmea-production-1-a3srealtime-eu-west-1-prod.kb.eu-west-1.aws.found.io/s/centraal-beheer/app/dashboards#/view/731a7b2c-c25f-4ff6-a032-5f62ef6d2272?_g=(filters:!())",
    space: "/s/centraal-beheer",
    dashboardId: "731a7b2c-c25f-4ff6-a032-5f62ef6d2272",
    dashboardVersion: 3,
    trafficPanelId: "aeb4840f-bb0e-4ac1-bac1-6e7892075291",
    pushUrl: "https://roosteroverzicht-traffic-bridge-production.up.railway.app/api/traffic-push"
  });

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  const idInput = document.getElementById("rosterId");
  const passwordInput = document.getElementById("password");
  const patInput = document.getElementById("pat");
  const publish = document.getElementById("publish");
  const status = document.getElementById("status");

  function setStatus(message, kind="") {
    status.textContent = message;
    status.className = `status${kind ? ` ${kind}` : ""}`;
  }

  function bytesToBase64(bytes) {
    let binary = "";
    const chunk = 0x8000;
    for (let i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode(...bytes.subarray(i,i+chunk));
    return btoa(binary);
  }

  function base64ToBytes(value) {
    const binary = atob(String(value || ""));
    const bytes = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function deriveKey(id, password, cryptoInfo, saltOverride) {
    const secret = encoder.encode(`${id}\u0000${password}`);
    const material = await crypto.subtle.importKey("raw", secret, "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({
      name: "PBKDF2",
      hash: cryptoInfo.hash || "SHA-256",
      salt: saltOverride || base64ToBytes(cryptoInfo.salt),
      iterations: Number(cryptoInfo.iterations) || 250000
    }, material, {
      name: "AES-GCM",
      length: Number(cryptoInfo.keyLength) || 256
    }, false, ["encrypt","decrypt"]);
  }

  async function decryptAnnual(id, password, secured) {
    if (secured?.kind !== "roosterhulp-encrypted-index" || secured?.encrypted !== true || !secured.crypto || !secured.payload) throw new Error("Het jaarbestand heeft niet het verwachte beveiligde formaat.");
    const key = await deriveKey(id, password, secured.crypto);
    const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:base64ToBytes(secured.crypto.iv) }, key, base64ToBytes(secured.payload));
    return JSON.parse(decoder.decode(plain));
  }

  async function encryptAnnual(id, password, parsed, oldCrypto) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const cryptoInfo = {
      version: Number(oldCrypto.version) || 1,
      kdf: "PBKDF2",
      hash: oldCrypto.hash || "SHA-256",
      iterations: Number(oldCrypto.iterations) || 250000,
      salt: bytesToBase64(salt),
      cipher: "AES-GCM",
      keyLength: Number(oldCrypto.keyLength) || 256,
      iv: bytesToBase64(iv)
    };
    const key = await deriveKey(id, password, cryptoInfo, salt);
    const cipher = await crypto.subtle.encrypt({ name:"AES-GCM", iv }, key, encoder.encode(JSON.stringify(parsed)));
    return {
      schemaVersion: 1,
      kind: "roosterhulp-encrypted-index",
      encrypted: true,
      crypto: cryptoInfo,
      payload: bytesToBase64(new Uint8Array(cipher))
    };
  }

  function updateExternalPlannerLink(privateConfig) {
    const groups = Array.isArray(privateConfig.externalSiteGroups) ? privateConfig.externalSiteGroups : [];
    for (const group of groups) {
      const items = Array.isArray(group?.items) ? group.items : Array.isArray(group?.links) ? group.links : [];
      for (const item of items) {
        const href = String(item?.href || item?.url || "");
        if (!/ASES_Roosterplanner\.html(?:[?#]|$)/i.test(href)) continue;
        if (Object.prototype.hasOwnProperty.call(item, "href")) item.href = href.replace(/ASES_Roosterplanner\.html/i, "roosterplanner.html");
        if (Object.prototype.hasOwnProperty.call(item, "url")) item.url = href.replace(/ASES_Roosterplanner\.html/i, "roosterplanner.html");
      }
    }
  }

  async function currentFileMetadata(pat) {
    const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${YEAR_FILE}?ref=${BRANCH}&t=${Date.now()}`, {
      cache: "no-store",
      headers: { Authorization:`Bearer ${pat}`, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" }
    });
    if (!response.ok) throw new Error(`GitHub kon ${YEAR_FILE} niet lezen (HTTP ${response.status}).`);
    return response.json();
  }

  async function publishFile(pat, sha, secured) {
    const text = JSON.stringify(secured, null, 2) + "\n";
    const content = bytesToBase64(encoder.encode(text));
    const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${YEAR_FILE}`, {
      method: "PUT",
      headers: { Authorization:`Bearer ${pat}`, Accept:"application/vnd.github+json", "Content-Type":"application/json", "X-GitHub-Api-Version":"2022-11-28" },
      body: JSON.stringify({ message:"Move ASES and collector config into encrypted roster data", content, sha, branch:BRANCH })
    });
    let data = null;
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) throw new Error(data?.message || `GitHub-publicatie mislukte (HTTP ${response.status}).`);
    return data;
  }

  publish.addEventListener("click", async () => {
    const id = idInput.value.trim();
    const password = passwordInput.value;
    const pat = patInput.value.trim();
    if (!id || !password || !pat) { setStatus("Vul team-ID, teamwachtwoord en GitHub PAT in.", "error"); return; }

    publish.disabled = true;
    setStatus("Jaarbestand wordt opgehaald en ontsleuteld…");
    try {
      const metadata = await currentFileMetadata(pat);
      const rawResponse = await fetch(`${YEAR_FILE}?v=${Date.now()}`, { cache:"no-store" });
      if (!rawResponse.ok) throw new Error(`Kon ${YEAR_FILE} niet via de site laden.`);
      const secured = await rawResponse.json();
      const parsed = await decryptAnnual(id, password, secured);
      if (parsed?.kind !== "roosterhulp-index") throw new Error("Het ontsleutelde jaarbestand heeft een onverwacht formaat.");

      const current = parsed.privateConfig && typeof parsed.privateConfig === "object" && !Array.isArray(parsed.privateConfig) ? parsed.privateConfig : {};
      const traffic = current.traffic && typeof current.traffic === "object" && !Array.isArray(current.traffic) ? current.traffic : {};
      parsed.privateConfig = {
        ...current,
        asesPlanner: JSON.parse(JSON.stringify(ASES)),
        traffic: { ...traffic, collector: JSON.parse(JSON.stringify(COLLECTOR)) }
      };
      updateExternalPlannerLink(parsed.privateConfig);
      parsed.privateDataVersion = Math.max(Number(parsed.privateDataVersion) || 0, 5);
      parsed.privateConfigUpdatedAt = new Date().toISOString();

      setStatus("Nieuwe private configuratie wordt versleuteld…");
      const next = await encryptAnnual(id, password, parsed, secured.crypto);
      setStatus("Versleutelde configuratie wordt naar GitHub gepubliceerd…");
      const result = await publishFile(pat, metadata.sha, next);
      setStatus(`Klaar. De private ASES- en Traffic Collector-configuratie staat versleuteld in ${YEAR_FILE}.\nCommit: ${result?.commit?.sha || "aangemaakt"}`, "ok");
      passwordInput.value = "";
      patInput.value = "";
    } catch (error) {
      console.error(error);
      setStatus(error?.message || "De migratie is mislukt.", "error");
    } finally {
      publish.disabled = false;
    }
  });
})();
</script>
</body>
</html>
