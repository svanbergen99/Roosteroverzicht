name: Finalize background brightness

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate brightness default
        shell: bash
        run: |
          sed -i 's/agenda-export.js?v=20260903-66/agenda-export.js?v=20260903-67/' index.html
          node --check agenda-export.js
          node --check background-brightness.js
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Finalize full background brightness default"
            git push
          fi
