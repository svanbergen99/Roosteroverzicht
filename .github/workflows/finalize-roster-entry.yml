name: Finalize protected roster entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize roster entry
        run: |
          sed -i 's/agenda-export.js?v=20260903-61/agenda-export.js?v=20260903-62/' index.html
          sed -i 's#const REPO = "svanbergen99/Rooster";#const REPO = "svanbergen99/Roosteroverzicht";#' roster-controller.js
          node --check agenda-export.js
          node --check roster-start-access.js
          node --check roster-controller.js
      - name: Commit finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html roster-controller.js
          git commit -m 'Finalize protected roster entry'
          git push
