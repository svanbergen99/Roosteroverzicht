name: Bump leave overview cache

on:
  push:
    paths:
      - '.github/workflows/bump-leave-overview-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update agenda loader cache query
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'agenda-export.js?v=20260903-67'
          new = 'agenda-export.js?v=20260903-68'
          if old not in text:
              raise SystemExit(f'Expected cache marker not found: {old}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load leave overview cache version 68"
          git push
