name: Build clean Easter video

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-easter-video.yml"

permissions:
  contents: write

jobs:
  build-easter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create clean Easter ending
        shell: bash
        run: |
          set -euo pipefail
          INPUT="Happy Eastern.mp4"
          test -s "$INPUT"

          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSerif-Italic.ttf"
          if [ ! -f "$FONT" ]; then
            FONT="/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf"
          fi
          printf "%s" "collega's" > /tmp/collegas.txt

          # Pak het laatste schone beeld precies rond het openen van het ei.
          ffmpeg -y -ss 8.95 -i "$INPUT" -frames:v 1 /tmp/easter-clean.png

          # Maak een rustige eindscene: zelfde beeld, subtiele zoom en tekst die uit de gloed verschijnt.
          ffmpeg -y \
            -loop 1 -t 2.9 -i /tmp/easter-clean.png \
            -f lavfi -t 2.9 -i anullsrc=channel_layout=stereo:sample_rate=48000 \
            -vf "scale=360:640:force_original_aspect_ratio=increase,crop=360:640,zoompan=z='min(zoom+0.00045,1.025)':d=73:s=360x640:fps=25,drawtext=fontfile='${FONT}':text='Fijne Pasen':fontcolor=white:fontsize=42:x=(w-text_w)/2:y=100:borderw=2:bordercolor=0xD99B27AA:shadowcolor=0x6B3B00BB:shadowx=2:shadowy=3:alpha='if(lt(t,0.25),0,if(lt(t,0.95),(t-0.25)/0.70,1))',drawtext=fontfile='${FONT}':textfile=/tmp/collegas.txt:fontcolor=white:fontsize=28:x=(w-text_w)/2:y=156:borderw=1:bordercolor=0xD99B27AA:shadowcolor=0x6B3B00BB:shadowx=2:shadowy=2:alpha='if(lt(t,0.60),0,if(lt(t,1.25),(t-0.60)/0.65,1))',format=yuv420p" \
            -c:v libx264 -preset medium -crf 18 -r 25 \
            -c:a aac -b:a 96k -ar 48000 \
            /tmp/easter-end.mp4

          # Houd de originele video alleen tot vlak voordat de promotionele eindkaart begint.
          ffmpeg -y -i "$INPUT" -t 9.1 \
            -vf "scale=360:640:force_original_aspect_ratio=increase,crop=360:640,format=yuv420p" \
            -af "afade=t=out:st=8.3:d=0.8" \
            -c:v libx264 -preset medium -crf 18 -r 25 \
            -c:a aac -b:a 128k -ar 48000 \
            /tmp/easter-main.mp4

          # Voeg beide delen samen tot één normale MP4.
          ffmpeg -y -i /tmp/easter-main.mp4 -i /tmp/easter-end.mp4 \
            -filter_complex "[0:v][0:a][1:v][1:a]concat=n=2:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 25 \
            -c:a aac -b:a 128k -ar 48000 -movflags +faststart \
            /tmp/Happy_Eastern_final.mp4

          mv /tmp/Happy_Eastern_final.mp4 "$INPUT"
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$INPUT"

      - name: Commit final MP4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Happy Eastern.mp4"
          if git diff --cached --quiet; then
            echo "Geen wijziging om te committen."
            exit 0
          fi
          git commit -m "Clean Easter video ending"
          git push
