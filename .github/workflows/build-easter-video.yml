name: Build clean Easter video

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-easter-video.yml"

permissions:
  contents: write

jobs:
  build-easter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render approved Easter ending
        shell: bash
        run: |
          set -euo pipefail
          INPUT="Happy Eastern.mp4"
          ENDCARD="/tmp/easter-endcard.jpg"
          test -s "$INPUT"
          test -s ".github/easter-endcard.b64"
          base64 --decode ".github/easter-endcard.b64" > "$ENDCARD"
          test -s "$ENDCARD"

          # Maak van het goedgekeurde eindbeeld een korte videosectie.
          ffmpeg -y \
            -loop 1 -framerate 25 -i "$ENDCARD" \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=48000 \
            -t 2.8 -shortest \
            -vf "scale=360:640:force_original_aspect_ratio=increase,crop=360:640,setsar=1,format=yuv420p" \
            -r 25 -c:v libx264 -preset veryfast -crf 18 \
            -c:a aac -b:a 128k -ar 48000 \
            /tmp/easter-endcard.mp4

          # Laat de sierlijke tekst precies tijdens het openen van het ei in beeld vloeien.
          # Het promotionele originele einde wordt niet meer zichtbaar.
          ffmpeg -y \
            -i "$INPUT" -i /tmp/easter-endcard.mp4 \
            -filter_complex "[0:v]trim=start=0:end=9.2,setpts=PTS-STARTPTS,fps=25,settb=AVTB[vmain];[1:v]trim=duration=2.8,setpts=PTS-STARTPTS,fps=25,settb=AVTB[vend];[vmain][vend]xfade=transition=fade:duration=0.5:offset=8.7,format=yuv420p[vout];[0:a]atrim=start=0:end=9.2,asetpts=PTS-STARTPTS[amain];[1:a]atrim=duration=2.8,asetpts=PTS-STARTPTS[aend];[amain][aend]acrossfade=d=0.5:c1=tri:c2=tri[aout]" \
            -map "[vout]" -map "[aout]" -t 11.5 \
            -c:v libx264 -preset veryfast -crf 18 -r 25 \
            -c:a aac -b:a 128k -ar 48000 -movflags +faststart \
            /tmp/Happy_Eastern_final.mp4

          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 /tmp/Happy_Eastern_final.mp4)"
          echo "Final duration: ${DURATION} seconds"
          python3 - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 11.0 <= duration <= 12.0:
              raise SystemExit(f"Unexpected final duration: {duration}")
          PY

          mv /tmp/Happy_Eastern_final.mp4 "$INPUT"

      - name: Commit final MP4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Happy Eastern.mp4"
          if git diff --cached --quiet; then
            echo "Geen wijziging om te committen."
            exit 0
          fi
          git commit -m "Replace Easter promotional ending"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}"
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo "Kon de gerenderde MP4 niet naar main pushen."
          exit 1
