name: Finalize automatic holiday effects

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize automatic effects
        shell: bash
        run: |
          sed -i 's/agenda-export.js?v=20260903-62/agenda-export.js?v=20260903-64/' index.html
          sed -i 's/const VERSION = "20260903-62";/const VERSION = "20260903-64";/' roster-start-access.js
          node --check agenda-export.js
          node --check holiday-effect-auto.js
          node --check visual-audio-controls.js
          node --check roster-start-access.js
      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html roster-start-access.js
          git commit -m "Finalize automatic holiday effects"
          git push
