name: Copy CollegaPortaal snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
      - name: Copy CollegaPortaal snapshot
        shell: bash
        run: |
          git clone --depth 1 https://github.com/svanbergen99/CollegaPortaal.git /tmp/collegaportaal
          rsync -a --delete --exclude='.git/' /tmp/collegaportaal/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Snapshot CollegaPortaal into Roosteroverzicht"
          git push
