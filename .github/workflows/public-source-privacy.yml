name: Public source privacy guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan current public source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root = Path('.')
          text_ext = {'.html','.js','.mjs','.cjs','.css','.json','.md','.txt','.ps1','.yml','.yaml','.py','.env'}
          skip_dirs = {'.git'}
          policy_file = Path('.github/workflows/public-source-privacy.yml')
          encrypted_files = {
              Path('Roosterindex_2026.json'),
              Path('Roosterindex_September_2026.json'),
              Path('Roosterindex_Oktober_2026.json'),
              Path('traffic-access.json'),
              Path('colleague-profiles-secure.json'),
          }
          findings = []

          # Internal hosts stay path-scoped. A reviewed source file may use only
          # the exact internal host(s) listed for that file; all other occurrences
          # remain a privacy failure.
          approved_internal_hosts = {
              Path('wfm-bridge-extension/manifest.json'): {
                  'genesyswfm.hosting.corp',
              },
              Path('traffic-collector-extension/manifest.json'): {
                  'achmea-production-1-a3srealtime-eu-west-1-prod.kb.eu-west-1.aws.found.io',
                  'roosteroverzicht-traffic-bridge-production.up.railway.app',
              },
              Path('bridge/handoff-proxy.js'): {
                  'achmea-production-1-a3srealtime-eu-west-1-prod.kb.eu-west-1.aws.found.io',
              },
              Path('rooster-bridge/identity-api.js'): {
                  'genesyswfm.hosting.corp',
              },
              Path('rooster-bridge/personal-api.js'): {
                  'genesyswfm.hosting.corp',
              },
              Path('rooster-bridge/team-api.js'): {
                  'genesyswfm.hosting.corp',
              },
              Path('rooster-bridge/team-session-api.js'): {
                  'genesyswfm.hosting.corp',
              },
              Path('wfm-identity-pair.html'): {
                  'genesyswfm.hosting.corp',
              },
              Path('wfm-login-bridge.js'): {
                  'genesyswfm.hosting.corp',
              },
          }

          # Absolute URLs are privacy-by-default: only reviewed public
          # infrastructure is accepted automatically. New domains still require
          # an explicit review here.
          safe_public_hosts = {
              'api.github.com',
              'raw.githubusercontent.com',
              'github.com',
              'svanbergen99.github.io',
              'cdn.jsdelivr.net',
              'geocoding-api.open-meteo.com',
              'api.open-meteo.com',
              'packages.microsoft.com',
              'roosteroverzicht-rooster-bridge-production.up.railway.app',
              'kcd-chat-production.up.railway.app',
              'localhost',
              '127.0.0.1',
              'example.invalid',
          }

          secret_patterns = [
              ('GitHub token', re.compile(r'\b(?:github_pat_|ghp_)[A-Za-z0-9_\-]{12,}')),
              ('Google/API style key', re.compile(r'\bAIza[0-9A-Za-z_\-]{20,}')),
              ('JWT', re.compile(r'\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{8,}\b')),
              ('Bearer token', re.compile(r'\bBearer\s+[A-Za-z0-9._~+/=-]{24,}', re.I)),
              ('API key value', re.compile(r'\bApiKey\s+[A-Za-z0-9._~+/=-]{24,}', re.I)),
              ('email address', re.compile(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b', re.I)),
          ]

          # Team-ID labels (KCDTeam01 t/m KCDTeam07) en de twee KCD-branding-
          # afbeeldingen zijn bewust openbaar. Wachtwoorden en privéconfiguratie
          # blijven versleuteld en mogen nooit in openbare bron terechtkomen.
          forbidden_markers = [
              'Medewerkerbestand.json','kcdIntranetLinks',
              'kcdIntranetTitle','kcdIntranetSubtitle'
          ]

          literal_url_host = re.compile(r'https?://([A-Za-z0-9.-]+)', re.I)

          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              if path in encrypted_files:
                  continue
              if path.suffix.lower() not in text_ext and path.name not in {'.env.example'}:
                  continue
              try:
                  text = path.read_text('utf-8')
              except Exception:
                  continue

              # Policy source contains its own detection strings, so only actual
              # secret-value regexes are applied to this workflow file itself.
              is_policy = path == policy_file

              for label, rx in secret_patterns:
                  if rx.search(text):
                      findings.append(f'{path}: {label}')

              if not is_policy:
                  for marker in forbidden_markers:
                      if marker in text:
                          findings.append(f'{path}: forbidden public marker {marker}')

                  approved_for_path = approved_internal_hosts.get(path, set())
                  for host in literal_url_host.findall(text):
                      host = host.lower().rstrip('.')
                      if host in safe_public_hosts or host in approved_for_path:
                          continue
                      findings.append(f'{path}: unapproved absolute URL host {host}')

                  # Catch internal host fragments even when they are not written as
                  # a complete absolute URL.
                  lowered = text.lower()
                  if '.corp' in lowered and 'genesyswfm.hosting.corp' not in approved_for_path:
                      findings.append(f'{path}: internal .corp host outside approved source path')
                  if 'found.io' in lowered and not any(host.endswith('.found.io') for host in approved_for_path):
                      findings.append(f'{path}: internal Kibana host outside approved source path')
                  if 'roosteroverzicht-traffic-bridge-production.up.railway.app' in lowered:
                      if path != Path('traffic-collector-extension/manifest.json'):
                          findings.append(f'{path}: Traffic bridge host outside approved extension manifest')

          if findings:
              print('Public-source privacy scan failed:')
              for item in sorted(set(findings)):
                  print(' -', item)
              sys.exit(1)

          print('Public-source privacy scan passed.')
          PY
