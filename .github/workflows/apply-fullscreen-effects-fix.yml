name: Apply fullscreen video and 12 second effects fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-fullscreen-effects-fix.yml"

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch video fullscreen and effect duration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          # 1) Video: selected MP4 goes fullscreen as the video element itself.
          # Closing/end of playback explicitly exits fullscreen again.
          video_path = Path("video-library-ui.js")
          video = video_path.read_text(encoding="utf-8")

          marker = '''  function updateTrimVisuals() {\n'''
          fullscreen_helpers = '''  function requestPlayerFullscreen() {\n    if (!player) return;\n    try {\n      if (typeof player.requestFullscreen === "function") {\n        const request = player.requestFullscreen({ navigationUI: "hide" });\n        request?.catch?.(() => {\n          try { player.webkitEnterFullscreen?.(); } catch (_) {}\n        });\n        return;\n      }\n      player.webkitEnterFullscreen?.();\n    } catch (_) {\n      try { player.webkitEnterFullscreen?.(); } catch (_) {}\n    }\n  }\n\n  function exitPlayerFullscreen() {\n    try {\n      if (player?.webkitDisplayingFullscreen) player.webkitExitFullscreen?.();\n    } catch (_) {}\n    try {\n      if (document.fullscreenElement) {\n        const exit = document.exitFullscreen?.();\n        exit?.catch?.(() => {});\n      } else if (document.webkitFullscreenElement) {\n        document.webkitExitFullscreen?.();\n      }\n    } catch (_) {}\n  }\n\n  function updateTrimVisuals() {\n'''
          video = replace_once(video, marker, fullscreen_helpers, "insert fullscreen helpers")

          video = replace_once(
              video,
              '''    player?.addEventListener("durationchange", updateTrimControl);\n\n    player?.addEventListener("play", () => {\n''',
              '''    player?.addEventListener("durationchange", updateTrimControl);\n    player?.addEventListener("ended", closeVideo);\n\n    player?.addEventListener("play", () => {\n''',
              "close video on ended"
          )

          video = replace_once(
              video,
              '''    player.load();\n    playerSection.hidden = false;\n\n    requestAnimationFrame(() => {\n''',
              '''    player.load();\n    playerSection.hidden = false;\n    requestPlayerFullscreen();\n\n    requestAnimationFrame(() => {\n''',
              "request fullscreen on selection"
          )

          video = replace_once(
              video,
              '''  function closeVideo() {\n    if (!playerSection || !player) return;\n    try {\n      player.pause();\n''',
              '''  function closeVideo() {\n    if (!playerSection || !player) return;\n    exitPlayerFullscreen();\n    try {\n      player.pause();\n''',
              "exit fullscreen on close"
          )

          video_path.write_text(video, encoding="utf-8")

          # 2) Temporary effects from the Effecten menu run for 12 seconds.
          # holiday-scenes.js and the persistent interactive scenes are intentionally untouched.
          effects_path = Path("effects.js")
          effects = effects_path.read_text(encoding="utf-8")

          effects = replace_once(
              effects,
              '''  const MOBILE = () => window.innerWidth < 680;\n  const CAP = () => MOBILE() ? 220 : 360;\n''',
              '''  const MOBILE = () => window.innerWidth < 680;\n  const CAP = () => MOBILE() ? 220 : 360;\n  const ACTIVE_EFFECT_DURATION_MS = 12000;\n  const ACTIVE_EFFECT_FADE_AT_MS = 11200;\n  const ACTIVE_EMITTER_UNTIL_MS = 10200;\n''',
              "add 12 second effect constants"
          )

          effects = replace_once(
              effects,
              '''      until: Math.min(startedAt + duration, startedAt + 2200),\n''',
              '''      until: startedAt + ACTIVE_EMITTER_UNTIL_MS,\n''',
              "extend active emitters"
          )

          effects = replace_once(
              effects,
              '''    endAt = startedAt + Math.min(duration, 3100);\n''',
              '''    endAt = startedAt + ACTIVE_EFFECT_DURATION_MS;\n''',
              "extend effect animation"
          )

          effects = replace_once(
              effects,
              '''    }, 2550);\n    hardStopTimer = window.setTimeout(stopEffect, 3100);\n''',
              '''    }, ACTIVE_EFFECT_FADE_AT_MS);\n    hardStopTimer = window.setTimeout(stopEffect, ACTIVE_EFFECT_DURATION_MS);\n''',
              "extend effect fade and stop"
          )

          effects_path.write_text(effects, encoding="utf-8")
          PY

      - name: Verify patched JavaScript parses
        shell: bash
        run: |
          set -euo pipefail
          node --check video-library-ui.js
          node --check effects.js
          grep -q 'ACTIVE_EFFECT_DURATION_MS = 12000' effects.js
          grep -q 'requestPlayerFullscreen' video-library-ui.js
          grep -q 'exitPlayerFullscreen' video-library-ui.js

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video-library-ui.js effects.js
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi
          git commit -m "Fullscreen video playback and 12 second effects"
          git push origin HEAD:main
