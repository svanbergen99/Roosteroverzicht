name: Finalize birthday scene

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate birthday scene
        shell: bash
        run: |
          sed -i 's/agenda-export.js?v=20260903-64/agenda-export.js?v=20260903-65/' index.html
          node --check agenda-export.js
          node --check holiday-effect-auto.js
          node --check birthday-scene.js
          node --check public-portal.js
      - name: Commit cache bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Bump birthday scene cache version"
            git push
          fi
