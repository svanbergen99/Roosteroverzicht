<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roosteroverzicht</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: light;
  --ink: #172033;
  --muted: #64748b;
  --line: #dbe2ea;
  --surface: #ffffff;
  --page: #f3f5f8;
  --accent: #7b2f73;
  --accent-dark: #542450;
  --background-overlay: .76;
  --soft-accent: #f4edf3;
}
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background-color: var(--page);
  background-image:
    linear-gradient(rgba(243, 245, 248, var(--background-overlay)), rgba(243, 245, 248, var(--background-overlay))),
    var(--page-background-image, none);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color: var(--ink);
}
body.locked { overflow: hidden; }
[hidden] { display: none !important; }
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(15, 23, 42, .82);
}
.welcome-card {
  width: min(760px, 100%);
  min-height: 310px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 28px;
  border-radius: 26px;
  overflow: hidden;
  box-shadow: 0 28px 80px rgba(0, 0, 0, .34);
  background-color: #fff;
  background-position: center;
  background-size: contain;
  background-repeat: no-repeat;
}
.welcome-content {
  width: min(390px, 100%);
  padding: 18px 22px 22px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, .8);
  border-radius: 18px;
  background: rgba(255, 255, 255, .88);
  backdrop-filter: blur(4px);
  box-shadow: 0 12px 34px rgba(15, 23, 42, .18);
}
.welcome-content h1 { margin: 0; font-size: clamp(26px, 4vw, 34px); }
button {
  border: 0;
  border-radius: 12px;
  padding: 13px 17px;
  background: var(--accent);
  color: #fff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: background-color .16s ease, box-shadow .16s ease, transform .16s ease;
}
button:hover { background: var(--accent-dark); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 3px solid rgba(123, 47, 115, .22); outline-offset: 2px; }
.full-button { width: 100%; margin-top: 22px; }
#app { min-height: 100vh; padding: 52px 20px; }
@media (max-width: 620px) {
  .welcome-card { min-height: 270px; padding: 20px; }
  .welcome-content { padding: 16px 18px 19px; }
  #app { padding: 24px 10px; }
}
</style>
</head>
<body class="locked">
<div id="welcomeOverlay" class="overlay" aria-modal="true" role="dialog" aria-labelledby="welcomeTitle">
  <section class="welcome-card">
    <div class="welcome-content">
      <h1 id="welcomeTitle">Welkom Collega's</h1>
      <button id="continueButton" class="full-button" type="button">Verder</button>
    </div>
  </section>
</div>
<main id="app" hidden>
  <section id="publicPrimaryActions" class="public-primary-actions" aria-label="Openbare startpagina">
    <div class="public-home-intro">
      <span class="public-home-kicker">KCD</span>
      <h1>Startpagina</h1>
      <p>Openbare hulpmiddelen, weer, thema’s en visuele functies.</p>
    </div>
  </section>
</main>
<script src="agenda-export.js?v=20260910-open-ui"></script>
</body>
</html>
